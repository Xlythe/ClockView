pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'watchface-format-screenshots'

// The plugin under test is the one in this checkout, not the last one released.
includeBuild('../..') {
    dependencySubstitution {
        substitute module('com.xlythe:watchface-format') using project(':watchface-format')
    }
}

include ':provider'
// Every face in cases.groovy is a project of its own, since each is a watch face of its own. They
// are written into build/ rather than kept in the tree: the table is the source.
List<Map> faces = new GroovyShell().evaluate(file('cases.groovy')) as List<Map>
file('build/faces').mkdirs()
include ':faces'
project(':faces').projectDir = file('build/faces')
faces.each { Map face ->
    File dir = file("build/faces/${face.name}")
    dir.mkdirs()
    include ":faces:${face.name}"
    project(":faces:${face.name}").projectDir = dir
}
