plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.nmcp' version '1.5.0'
}

Properties projectProperties = new Properties()
projectProperties.load(rootProject.file('gradle.properties').newDataInputStream())

Properties localProperties = new Properties()
File localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

group = projectProperties.getProperty('bintray.groupId')
version = projectProperties.getProperty('watchfaceFormat.libraryVersion')
base {
    archivesName = projectProperties.getProperty('watchfaceFormat.artifact')
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.encoding = 'UTF-8'
    options.encoding = 'UTF-8'
}

tasks.named('javadocJar', Jar) {
    // The plugin is written in Groovy, so ship groovydoc as the javadoc artifact.
    from tasks.named('groovydoc')
}

gradlePlugin {
    plugins {
        watchfaceFormat {
            id = 'com.xlythe.watchface-format'
            implementationClass = 'com.xlythe.watchface.format.WatchFaceFormatPlugin'
            displayName = projectProperties.getProperty('watchfaceFormat.libraryName')
            description = projectProperties.getProperty('watchfaceFormat.libraryDescription')
        }
    }
}

dependencies {
    implementation localGroovy()
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = projectProperties.getProperty('watchfaceFormat.libraryName')
            description = projectProperties.getProperty('watchfaceFormat.libraryDescription')
            url = projectProperties.getProperty('bintray.siteUrl')
            licenses {
                license {
                    name = projectProperties.getProperty('bintray.licenseName')
                    url = projectProperties.getProperty('bintray.licenseUrl')
                }
            }
            developers {
                developer {
                    id = projectProperties.getProperty('bintray.developerId')
                    name = projectProperties.getProperty('bintray.developerName')
                    email = projectProperties.getProperty('bintray.developerEmail')
                }
            }
            scm {
                connection = projectProperties.getProperty('bintray.gitUrl')
                developerConnection = projectProperties.getProperty('bintray.gitUrl')
                url = projectProperties.getProperty('bintray.siteUrl')
            }
        }
    }
    // java-gradle-plugin adds this publication lazily, so configure it when it appears.
    publications.withType(MavenPublication).matching { it.name == 'pluginMaven' }.configureEach {
        artifactId = projectProperties.getProperty('watchfaceFormat.artifact')
    }
}

nmcp {
    publishAllPublicationsToCentralPortal {
        username = localProperties.getProperty('bintray.username')
        password = localProperties.getProperty('bintray.password')
        publishingType = 'AUTOMATIC'
    }
}

tasks.named('publish') {
    dependsOn('nmcpPublishAllPublicationsToCentralPortal')
}

signing {
    if (localProperties.getProperty('signing.key') != null) {
        useInMemoryPgpKeys(
                localProperties.getProperty('signing.keyId'),
                localProperties.getProperty('signing.key'),
                localProperties.getProperty('signing.password'),
        )
    }
    sign publishing.publications
}

// Only sign when publishing to Maven Central, so publishToMavenLocal works for local testing.
gradle.taskGraph.whenReady { graph ->
    boolean remote = graph.hasTask("${project.path}:publish") ||
            graph.hasTask("${project.path}:nmcpPublishAllPublicationsToCentralPortal")
    tasks.withType(Sign).configureEach { enabled = remote }
}
